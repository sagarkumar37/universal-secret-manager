# keep the client IP / scheme set by a TLS proxy in front of us, else use our own view
map $http_x_real_ip $client_ip { "" $remote_addr; default $http_x_real_ip; }
map $http_x_forwarded_proto $client_proto { "" $scheme; default $http_x_forwarded_proto; }

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    root /usr/share/nginx/html;
    location / { try_files $uri /index.html; }

    location ~ ^/(api|auth)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}
